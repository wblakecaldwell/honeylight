<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honeylight</title>
<meta name="description" content="Live one short life as a honeybee. Fly through a giant meadow, forage, dodge wasps and find your way home. Free in your desktop browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Honeylight">
<meta property="og:description" content="Live one short life as a honeybee. Fly through a giant meadow, forage, dodge wasps and find your way home. Free in your desktop browser.">
<meta property="og:url" content="https://blakecaldwell.net/honeylight/">
<meta property="og:image" content="https://blakecaldwell.net/honeylight/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A fuzzy honeybee sipping from a giant purple flower in a sunlit meadow">
<meta name="twitter:card" content="summary_large_image">
<style>
  html,body{margin:0;height:100%;background:#0a0502;overflow:hidden;font-family:Georgia,'Iowan Old Style',serif;color:#f6dfae;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ov{position:fixed;inset:0;pointer-events:none}
  #vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(8,4,0,.38) 82%,rgba(4,2,0,.78) 100%)}
  #water{background:linear-gradient(#2f6f6a,#0d2f33);opacity:0}
  #drops{opacity:0;background:
    radial-gradient(circle at 12% 22%,rgba(255,255,255,.55) 0,rgba(190,225,255,.18) 2.2%,transparent 3%),
    radial-gradient(circle at 84% 14%,rgba(255,255,255,.5) 0,rgba(190,225,255,.18) 3%,transparent 4%),
    radial-gradient(circle at 91% 63%,rgba(255,255,255,.5) 0,rgba(190,225,255,.16) 2.4%,transparent 3.2%),
    radial-gradient(circle at 7% 74%,rgba(255,255,255,.5) 0,rgba(190,225,255,.16) 3.4%,transparent 4.4%),
    radial-gradient(circle at 30% 91%,rgba(255,255,255,.45) 0,rgba(190,225,255,.14) 2%,transparent 2.8%),
    radial-gradient(circle at 66% 88%,rgba(255,255,255,.45) 0,rgba(190,225,255,.14) 2.8%,transparent 3.6%),
    radial-gradient(circle at 48% 6%,rgba(255,255,255,.45) 0,rgba(190,225,255,.14) 1.8%,transparent 2.6%)}
  #black{background:#050201;opacity:0}
  #title{display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;
    background:radial-gradient(ellipse at 50% 55%,#5a2f08 0,#1c0d03 55%,#070301 100%);transition:opacity 1.6s}
  #title h1{font-weight:normal;font-size:clamp(40px,8vw,92px);letter-spacing:.08em;margin:0;color:#ffd98a;text-shadow:0 0 40px rgba(255,170,40,.55)}
  #title p{font-style:italic;opacity:.75;font-size:clamp(14px,2vw,20px);margin:.9em 0 0}
  #title .go{margin-top:2.4em;font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;animation:pulse 2.4s infinite}
  @keyframes pulse{50%{opacity:.25}}
  #hint{position:fixed;left:0;right:0;bottom:7%;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s;font-size:15px;letter-spacing:.06em;color:#fff3d6;text-shadow:0 1px 6px #000}
  #hint kbd{display:inline-block;min-width:1.5em;padding:.25em .5em;margin:0 .15em;border:1px solid rgba(255,235,190,.55);border-radius:6px;background:rgba(30,16,4,.45);font-family:inherit;font-size:14px}
  #hud{position:fixed;left:18px;top:14px;pointer-events:none;opacity:0;transition:opacity 1s;font-size:15px;color:#fff3d6;text-shadow:0 1px 6px #000;line-height:1.55}
  #hud b{font-size:20px;color:#ffd98a;font-weight:normal}
  #hud .dim{opacity:.7;font-size:13px;font-style:italic}
  #hud .warn{color:#ffb38a;font-size:14px;animation:pulse 0.8s infinite}
  #hud .jar{display:inline-block;width:12px;height:14px;margin-right:7px;border-radius:3px 3px 5px 5px;background:linear-gradient(#ffd27a,#d98a12);box-shadow:0 0 8px rgba(255,180,40,.7);vertical-align:-1px}
  #hud .pips i{display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:50%;border:1px solid rgba(255,230,170,.6);background:rgba(30,16,4,.35)}
  #hud .pips i.on{background:radial-gradient(circle at 35% 35%,#fff2b0,#f0a820);border-color:#ffe08a;box-shadow:0 0 6px rgba(255,190,60,.8)}
  #hud .pips i.gold{background:radial-gradient(circle at 35% 35%,#ffffff,#ffcf3a);box-shadow:0 0 10px rgba(255,230,120,1)}
  #hud kbd{display:inline-block;min-width:1.2em;padding:0 .35em;border:1px solid rgba(255,235,190,.55);border-radius:4px;background:rgba(30,16,4,.45);font-family:inherit;font-size:12px;font-style:normal}
  #toast{position:fixed;left:0;right:0;top:12%;text-align:center;pointer-events:none;opacity:0;transition:opacity .7s;font-size:20px;color:#fff3d6;text-shadow:0 1px 8px #000,0 0 20px rgba(0,0,0,.5);line-height:1.4}
  #toast b{font-weight:normal;color:#ffd98a;font-size:24px}
  #toast span{font-size:15px;font-style:italic;opacity:.85}
  #keys{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);max-width:min(92vw,520px);padding:20px 30px 18px;border-radius:18px;background:radial-gradient(ellipse at 30% 15%,rgba(74,40,10,.9),rgba(24,12,3,.92));border:1px solid rgba(255,220,150,.32);box-shadow:0 10px 50px rgba(0,0,0,.55),inset 0 0 30px rgba(255,170,50,.08);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;color:#fff3d6;font-size:15px;line-height:1.35}
  #keys.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #keys h2{margin:0 0 .55em;font-weight:normal;font-size:23px;color:#ffd98a;letter-spacing:.06em;text-align:center}
  #keys .k{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;align-items:center}
  #keys .kk{text-align:right;white-space:nowrap}
  #keys kbd{display:inline-block;min-width:1.3em;padding:.12em .45em;margin:0 .1em;border:1px solid rgba(255,235,190,.55);border-radius:6px;background:rgba(30,16,4,.5);font-family:inherit;font-size:13px;text-align:center}
  #keys .dim{opacity:.5;font-style:italic}
  #keys .foot{margin-top:.9em;text-align:center;font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.65;animation:pulse 2.4s infinite}
  #keytip{position:fixed;right:16px;bottom:12px;font-size:12px;opacity:0;color:#fff3d6;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity 1s;letter-spacing:.05em}
  #keytip kbd{display:inline-block;padding:0 .35em;border:1px solid rgba(255,235,190,.5);border-radius:4px;background:rgba(30,16,4,.4);font-family:inherit;font-size:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="water" class="ov"></div>
<div id="drops" class="ov"></div>
<div id="vig" class="ov"></div>
<div id="black" class="ov"></div>
<div id="hint"></div>
<div id="hud"></div>
<div id="toast"></div>
<div id="keys"></div>
<div id="keytip"><kbd>Tab</kbd> keys</div>
<div id="title" class="ov"><h1>Honeylight</h1><p>a small life, beginning</p><div class="go">click to wake</div></div>
<script type="module" src="./main.js"></script>
<script type="module" src="./night.js"></script>
<script type="module" src="./moths.js"></script>
<script type="module" src="./runnight.js"></script>
<script type="module" src="./bat.js"></script>
<script type="module" src="./storm.js"></script>
<script type="module" src="./stage-menu.js"></script>
</body>
</html>
